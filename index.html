<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Budget Tracker 50/30/20 (IDR)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;0,900;1,600;1,700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
    <script>
      try {
        const theme = localStorage.getItem('budget_tracker_theme');
        if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
        const themeMode = localStorage.getItem('budget_tracker_theme_mode');
        if (themeMode === 'newspaper' || (!themeMode && true)) {
          document.documentElement.classList.add('theme-newspaper');
        } else {
          document.documentElement.classList.remove('theme-newspaper');
        }
      } catch (e) {}
    </script>
  </head>
  <body class="bg-slate-100 dark:bg-[#080d1a] text-slate-900 dark:text-slate-100 antialiased selection:bg-emerald-500/20">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
